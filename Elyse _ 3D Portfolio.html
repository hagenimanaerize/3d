<title>Elyse | 3D Portfolio</title>
<style>
:root{--bg:#05060f;--ink:#e8f1ff;--cyan:#38e8ff;--violet:#a66bff;box-sizing:border-box;color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",system-ui,sans-serif;overflow:hidden}
canvas{display:block;touch-action:none}
#hud{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:14px;font-size:13px;opacity:.85;max-width:60%;line-height:1.4}
#hud b{color:var(--cyan)}
#card{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);width:min(440px,92vw);background:rgba(8,12,28,.88);border:1px solid var(--cyan);border-radius:10px;padding:16px 18px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
#card.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#card h2{margin:0 0 6px;font-size:20px;color:var(--cyan)}
#card p{margin:0 0 10px;line-height:1.5;font-size:14px}
#card .tags span{display:inline-block;margin:0 6px 6px 0;padding:2px 9px;border:1px solid var(--violet);border-radius:99px;font-size:12px}
#card a{display:inline-block;margin-top:2px;padding:7px 14px;background:var(--cyan);color:#021018;border-radius:6px;text-decoration:none;font-weight:700;font-size:13px}
#card a:focus-visible{outline:2px solid #fff;outline-offset:2px}
#term{position:fixed;right:14px;top:calc(12px + env(safe-area-inset-top,0px));width:min(480px,92vw);height:min(320px,50vh);background:rgba(4,8,20,.93);border:1px solid var(--violet);border-radius:8px;display:none;flex-direction:column;font:13px/1.5 ui-monospace,Consolas,monospace}
#term.on{display:flex}
#out{flex:1;overflow:auto;padding:10px 12px;white-space:pre-wrap;color:#bfe9ff}
#term label{display:flex;gap:8px;padding:8px 12px;border-top:1px solid #2b3a6b;color:var(--cyan)}
#term label:focus-within{outline:2px solid var(--cyan);outline-offset:-2px}
#in{flex:1;background:none;border:0;color:var(--ink);font:inherit;outline:0}
#tbtn{position:fixed;left:14px;bottom:calc(20px + env(safe-area-inset-bottom,0px));background:rgba(8,12,28,.85);color:var(--cyan);border:1px solid var(--cyan);border-radius:6px;padding:8px 12px;font:13px ui-monospace,Consolas,monospace;cursor:pointer}
#tbtn:focus-visible{outline:2px solid #fff;outline-offset:2px}
</style>
</head>

const CY=0x38e8ff,VI=0xa66bff;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x05060f);scene.fog=new THREE.FogExp2(0x05060f,0.017);
const cam=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,200);

renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);

// floor

floor.rotation.x=-Math.PI/2;floor.position.z=-28;scene.add(floor);

const glass=new THREE.MeshStandardMaterial({color:0x12204a,transparent:true,opacity:.35,metalness:.6,roughness:.1});
[-6.2,6.2].forEach(x=>{const w=new THREE.Mesh(new THREE.BoxGeometry(.3,7,70),glass);w.position.set(x,3.5,-28);scene.add(w);
 [.15,6.8].forEach(y=>{const s=new THREE.Mesh(new THREE.BoxGeometry(.08,.08,70),new THREE.MeshBasicMaterial({color:x<0?CY:VI}));s.position.set(x*.95,y,-28);scene.add(s)})});

// card textures
function wrap(c,t,x,y,w,lh){const words=t.split(' ');let line='';for(const wd of words){const test=line+wd+' ';if(c.measureText(test).width>w&&line){c.fillText(line,x,y);line=wd+' ';y+=lh}else line=test}c.fillText(line,x,y);return y}
function cardTex(title,desc,tags,col){
 const cv=document.createElement('canvas');cv.width=1024;cv.height=640;const c=cv.getContext('2d');
 const g=c.createLinearGradient(0,0,1024,640);g.addColorStop(0,'#0b1330');g.addColorStop(1,'#1a0f3a');c.fillStyle=g;c.fillRect(0,0,1024,640);
 c.strokeStyle=col;c.lineWidth=6;c.strokeRect(24,24,976,592);
 c.fillStyle=col;c.font='bold 72px Trebuchet MS, sans-serif';c.fillText(title,64,150);
 c.fillStyle='#dfe8ff';c.font='34px Trebuchet MS, sans-serif';const y=wrap(c,desc,64,240,880,48);
 c.font='28px Trebuchet MS, sans-serif';let x=64;tags.forEach(t=>{const w=c.measureText(t).width+36;c.strokeStyle=col;c.lineWidth=2;c.strokeRect(x,540,w,48);c.fillStyle=col;c.fillText(t,x+18,574);x+=w+14});
 const tx=new THREE.CanvasTexture(cv);tx.anisotropy=4;return tx}

const spots=[];
PROJECTS.forEach((p,i)=>{
 const side=i%2?1:-1,z=-10-i*11,col=side<0?'#38e8ff':'#a66bff';
 const grp=new THREE.Group();
 const frame=new THREE.Mesh(new THREE.BoxGeometry(5.4,3.5,.15),new THREE.MeshBasicMaterial({color:side<0?CY:VI}));
 const pic=new THREE.Mesh(new THREE.PlaneGeometry(5,3.1),new THREE.MeshBasicMaterial({map:cardTex(p.title,p.desc,p.tags,col)}));
 pic.position.z=.09;grp.add(frame,pic);
 grp.position.set(side*5.9,3.2,z);grp.rotation.y=side<0?Math.PI/2:-Math.PI/2;scene.add(grp);
 spots.push({x:side*3.2,z,item:p,label:'Open project'});
});

function photoFrame(w,h,x,y,z,ry){const g=new THREE.Group();const f=new THREE.Mesh(new THREE.BoxGeometry(w+.35,h+.35,.12),new THREE.MeshBasicMaterial({color:CY}));const q=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:photoTex}));q.position.z=.07;g.add(f,q);g.position.set(x,y,z);g.rotation.y=ry;scene.add(g)}
photoFrame(2.8,4.2,-4.4,3.6,-61.7,0);

function panel(cv,w,h,x,y,z,ry,col){const g=new THREE.Group();g.add(new THREE.Mesh(new THREE.BoxGeometry(w+.35,h+.35,.12),new THREE.MeshBasicMaterial({color:col})));const q=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(cv)}));q.position.z=.07;g.add(q);g.position.set(x,y,z);g.rotation.y=ry;scene.add(g)}
const SKILLS=[['JavaScript',90],['Vue',85],['Three.js',70],['Node.js',75],['Git',80],['CSS',85]];
(()=>{const cv=document.createElement('canvas');cv.width=1024;cv.height=640;const c=cv.getContext('2d');c.fillStyle='#0a0f24';c.fillRect(0,0,1024,640);
c.font='28px Consolas, monospace';c.fillStyle='#7f8bb8';c.fillText('// skills.json (edit SKILLS in the code)',50,70);
SKILLS.forEach(([n,v],i)=>{const y=120+i*80;c.fillStyle='#a66bff';c.fillText(n,50,y+30);c.fillStyle='#1a2350';c.fillRect(300,y+6,600,32);const g=c.createLinearGradient(300,0,900,0);g.addColorStop(0,'#38e8ff');g.addColorStop(1,'#a66bff');c.fillStyle=g;c.fillRect(300,y+6,6*v,32);c.fillStyle='#e8f1ff';c.fillText(v+'%',915,y+34)});
panel(cv,5,3.1,5.85,3.2,-52,-Math.PI/2,VI)})();
(()=>{const cv=document.createElement('canvas');cv.width=1024;cv.height=640;const c=cv.getContext('2d');c.fillStyle='#0a0f24';c.fillRect(0,0,1024,640);
c.font='28px Consolas, monospace';c.fillStyle='#7f8bb8';c.fillText('// activity (sample data, swap in yours)',50,70);
let s=7;const r=()=>(s=(s*16807)%2147483647)/2147483647;const cols=['#151c3d','#12507a','#1b8fb5','#38e8ff'];
for(let w=0;w<26;w++)for(let d=0;d<7;d++){const v=r();c.fillStyle=cols[v<.35?0:v<.6?1:v<.85?2:3];c.fillRect(70+w*34,130+d*40,28,32)}
c.fillStyle='#bfe9ff';c.fillText('$ git log --since="6 months"',50,500);
panel(cv,5,3.1,-5.85,3.2,-52,Math.PI/2,CY)})();
const desk=new THREE.Mesh(new THREE.BoxGeometry(3.4,.9,1.4),new THREE.MeshStandardMaterial({color:0x1b2550,metalness:.5,roughness:.4}));desk.position.set(0,.45,-57);scene.add(desk);
const lap=new THREE.Mesh(new THREE.BoxGeometry(1.2,.75,.06),new THREE.MeshBasicMaterial({color:CY}));lap.position.set(0,1.3,-57.2);lap.rotation.x=-.25;scene.add(lap);
spots.push({x:0,z:-54,item:{title:'About '+ABOUT.name,desc:ABOUT.bio,tags:ABOUT.tags,url:ABOUT.url},label:ABOUT.cta,r:5.5});
// start sign
const sign=new THREE.Mesh(new THREE.PlaneGeometry(5,1),new THREE.MeshBasicMaterial({map:(()=>{const cv=document.createElement('canvas');cv.width=1024;cv.height=200;const c=cv.getContext('2d');c.fillStyle='#38e8ff';c.font='bold 90px Trebuchet MS, sans-serif';c.textAlign='center';c.fillText('Welcome. Walk forward.',512,125);return new THREE.CanvasTexture(cv)})(),transparent:true}));
sign.position.set(0,4.2,-3);scene.add(sign);

// player
const player=new THREE.Group();
const bodyM=new THREE.MeshStandardMaterial({color:0x6a4cff,roughness:.6});
const body=new THREE.Mesh(new THREE.CylinderGeometry(.35,.4,1.1,16),bodyM);body.position.y=.85;
const head=new THREE.Mesh(new THREE.SphereGeometry(.32,16,16),new THREE.MeshStandardMaterial({color:0xf0c9a0}));head.position.y=1.7;
const hood=new THREE.Mesh(new THREE.SphereGeometry(.35,16,16,0,Math.PI*2,0,Math.PI*.55),bodyM);hood.position.y=1.74;
const pack=new THREE.Mesh(new THREE.BoxGeometry(.45,.6,.25),new THREE.MeshBasicMaterial({color:CY}));pack.position.set(0,.95,.4);
player.add(body,head,hood,pack);player.position.set(0,0,2);scene.add(player);
const av=document.createElement('canvas');av.width=av.height=256;const avTex=new THREE.CanvasTexture(av);
const img=new Image();img.onload=()=>{const c=av.getContext('2d');c.save();c.beginPath();c.arc(128,128,118,0,Math.PI*2);c.clip();const s=img.width*.7;c.drawImage(img,img.width*.17,img.height*.113,s,s,10,10,236,236);c.restore();c.strokeStyle='#38e8ff';c.lineWidth=10;c.beginPath();c.arc(128,128,118,0,Math.PI*2);c.stroke();avTex.needsUpdate=true};img.src=PHOTO;
const badge=new THREE.Sprite(new THREE.SpriteMaterial({map:avTex,transparent:true,fog:false}));badge.position.y=2.7;player.add(badge);

// input
const keys={};let yaw=0,joy={x:0,y:0},joyId=null,joyO=null,dragId=null,lx=0;
addEventListener('keydown',e=>{keys[e.code]=true});addEventListener('keyup',e=>{keys[e.code]=false});
const cvs=renderer.domElement;
cvs.addEventListener('pointerdown',e=>{
 if(e.pointerType==='touch'&&e.clientX<innerWidth/2){joyId=e.pointerId;joyO={x:e.clientX,y:e.clientY}}
 else{dragId=e.pointerId;lx=e.clientX}});
addEventListener('pointermove',e=>{
 if(e.pointerId===joyId){joy.x=Math.max(-1,Math.min(1,(e.clientX-joyO.x)/50));joy.y=Math.max(-1,Math.min(1,(e.clientY-joyO.y)/50))}
 else if(e.pointerId===dragId){yaw-=(e.clientX-lx)*.005;lx=e.clientX}});
addEventListener('pointerup',e=>{if(e.pointerId===joyId){joyId=null;joy={x:0,y:0}}if(e.pointerId===dragId)dragId=null});
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});

// card UI
const card=document.getElementById('card'),ct=document.getElementById('ct'),cd=document.getElementById('cd'),cg=document.getElementById('cg'),cl=document.getElementById('cl');
let shown=null;
function show(s){
 if(s===shown)return;shown=s;
 if(!s){card.classList.remove('on');return}
 ct.textContent=s.item.title;cd.textContent=s.item.desc;
 cg.innerHTML='';s.item.tags.forEach(t=>{const e=document.createElement('span');e.textContent=t;cg.appendChild(e)});
 const ok=s.item.url&&s.item.url!=='#';cl.style.display=ok?'inline-block':'none';if(ok){cl.href=s.item.url;cl.textContent=s.label}
 card.classList.add('on')}

// loop
const clock=new THREE.Clock();let faceY=0;
function tick(){
 const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
 if(keys.ArrowLeft&&!keys.KeyA)yaw+=dt*1.6;if(keys.ArrowRight&&!keys.KeyD)yaw-=dt*1.6;
 let mx=(keys.KeyD?1:0)-(keys.KeyA?1:0)+joy.x,mz=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0)+joy.y;
 const len=Math.hypot(mx,mz);
 if(len>.05){mx/=Math.max(len,1);mz/=Math.max(len,1);
  const sp=6*dt,dx=mx*Math.cos(yaw)+mz*Math.sin(yaw),dz=-mx*Math.sin(yaw)+mz*Math.cos(yaw);
  player.position.x=Math.max(-5.3,Math.min(5.3,player.position.x+dx*sp));
  player.position.z=Math.max(-59,Math.min(4,player.position.z+dz*sp));
  faceY=Math.atan2(dx,dz)+Math.PI;
  body.position.y=.85+Math.abs(Math.sin(t*10))*.06;head.position.y=1.7+Math.abs(Math.sin(t*10))*.06}
 let d=faceY-player.rotation.y;d=Math.atan2(Math.sin(d),Math.cos(d));player.rotation.y+=d*Math.min(1,dt*10);
 const p=player.position,D=7,pitch=.38;
 const tx=p.x+Math.sin(yaw)*Math.cos(pitch)*D,ty=1.5+Math.sin(pitch)*D,tz=p.z+Math.cos(yaw)*Math.cos(pitch)*D;
 cam.position.lerp(new THREE.Vector3(tx,ty,tz),Math.min(1,dt*6));cam.lookAt(p.x,1.5,p.z);
 icons.forEach(m=>{m.rotation.x+=dt;m.rotation.y+=dt*1.3;m.position.y+=Math.sin(t+m.userData.o)*.002});
 let near=null;for(const s of spots){if(Math.hypot(p.x-s.x,p.z-s.z)<(s.r||4.6)){near=s;break}}
 show(near);
 renderer.render(scene,cam);requestAnimationFrame(tick)}
// terminal
const term=document.getElementById('term'),out=document.getElementById('out'),inp=document.getElementById('in'),tb=document.getElementById('tbtn');
function print(t){out.textContent+=t+'\n';out.scrollTop=out.scrollHeight}
function tog(on){const o=on===undefined?!term.classList.contains('on'):on;term.classList.toggle('on',o);if(o){inp.focus();if(!out.textContent)print('Welcome to '+ABOUT.name+'’s terminal. Type help.')}else inp.blur();for(const k in keys)keys[k]=false}
tb.onclick=()=>tog();
addEventListener('keydown',e=>{if(e.target===inp){if(e.key==='Escape')tog(false);e.stopPropagation()}else if(e.code==='KeyT'){e.preventDefault();tog(true)}},true);
const cmds={
 help:()=>'Commands: about, skills, projects, open <n>, contact, goto <n|about|start>, clear, exit',
 about:()=>ABOUT.name+' - '+ABOUT.role+'\n'+ABOUT.bio,
 skills:()=>SKILLS.map(s=>s[0].padEnd(12)+'#'.repeat(Math.round(s[1]/5))+' '+s[1]+'%').join('\n'),
 projects:()=>PROJECTS.map((p,i)=>(i+1)+'. '+p.title+' ['+p.tags.join(', ')+']').join('\n'),
 open:a=>{const p=PROJECTS[a-1];if(!p)return 'Usage: open <1-'+PROJECTS.length+'>';if(p.url==='#')return p.title+' has no link yet.';window.open(p.url,'_blank','noopener');return 'Opening '+p.title+'...'},
 contact:()=>ABOUT.url,
 goto:a=>{const n=parseInt(a);let z;if(a==='about')z=-52;else if(a==='start')z=2;else if(PROJECTS[n-1])z=-10-(n-1)*11+3;else return 'Usage: goto <1-'+PROJECTS.length+'|about|start>';player.position.set(0,0,z);return 'Teleported.'},
 clear:()=>{out.textContent='';return ''},
 exit:()=>{tog(false);return ''},
 sudo:()=>'Permission granted. You are hired.'
};
inp.addEventListener('keydown',e=>{if(e.key!=='Enter')return;const v=inp.value.trim();inp.value='';if(!v)return;print('$ '+v);const [c,...r]=v.split(/\s+/);const f=cmds[c.toLowerCase()];const res=f?f(r.join(' ')):'command not found: '+c+' (try help)';if(res)print(res)});
tick();
</script>
